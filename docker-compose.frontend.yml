
# Frontend development configuration
# Usage: docker-compose -f docker-compose.frontend.yml up -d
#
# Note: Backend must be running first (docker-compose up -d)
# Frontend connects to backend via host network

name: ibom_ai_agent_stack

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are baked into the browser bundle at build time, so a
        # runtime `environment:` entry cannot change them — after editing these
        # you must rebuild: docker compose -f docker-compose.frontend.yml build
        # --no-cache frontend. They must point at an address the BROWSER can
        # reach; the defaults assume the browser runs on the Docker host. When
        # you open the app from another machine, set PUBLIC_HOST to this host's
        # address (e.g. PUBLIC_HOST=10.0.0.5) or override each URL directly.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://${PUBLIC_HOST:-localhost}:8000}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-wss://${PUBLIC_HOST:-localhost}:3000}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://advancedanalytica.co.uk}
        - NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB=${NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB:-10}
        - NEXT_PUBLIC_MAX_CHAT_ATTACHMENTS=${NEXT_PUBLIC_MAX_CHAT_ATTACHMENTS:-20}
        - NEXT_PUBLIC_RAG_ENABLED=true
        - NEXT_PUBLIC_OAUTH_PROVIDERS=${NEXT_PUBLIC_OAUTH_PROVIDERS:-google}
    container_name: ibom_ai_agent_stack_frontend
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      # Server-side only: resolved inside this container, never by the browser.
      - BACKEND_URL=${BACKEND_URL:-http://host.docker.internal:8000}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://${PUBLIC_HOST:-localhost}:8000}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://advancedanalytica.co.uk}
      - NEXT_PUBLIC_OAUTH_PROVIDERS=${NEXT_PUBLIC_OAUTH_PROVIDERS:-google}
      - NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB=${NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB:-10}
      - NEXT_PUBLIC_MAX_CHAT_ATTACHMENTS=${NEXT_PUBLIC_MAX_CHAT_ATTACHMENTS:-20}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      # The oven/bun image has no curl/wget, so probe with bun's built-in fetch.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  local_https:
    image: nginx:1.27-alpine
    container_name: ibom_ai_agent_stack_local_https
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "3000:443"
    volumes:
      - ./nginx/local-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-check-certificate",
          "-q",
          "-O",
          "/dev/null",
          "https://localhost/api/health",
        ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
