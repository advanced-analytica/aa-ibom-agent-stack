
# Backend development configuration
# Usage: docker-compose up -d

name: ibom_ai_agent_stack

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ibom_ai_agent_stack_backend:dev
    container_name: ibom_ai_agent_stack_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/cli:/app/cli:ro
      - media_data:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=true
      - ENVIRONMENT=local
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    # --ws websockets-sansio: uvicorn's `auto` picks the legacy websockets impl,
    # which is broken with websockets >=14 (handshake → HTTP 500). The sansio
    # implementation is the modern, compatible one. Required for the chat WS.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --ws websockets-sansio
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ibom_ai_agent_stack_redis
    # Port exposed only for local development - remove in production
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  celery_worker:
    image: ibom_ai_agent_stack_backend:dev
    pull_policy: never
    container_name: ibom_ai_agent_stack_celery_worker
    volumes:
      - ./backend/app:/app/app:ro
      - media_data:/app/media
    command: celery -A app.worker.celery_app worker --loglevel=debug
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=true
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - backend
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/celery -A app.worker.celery_app inspect ping --destination celery@$$(hostname) | grep -q pong"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  celery_beat:
    image: ibom_ai_agent_stack_backend:dev
    pull_policy: never
    container_name: ibom_ai_agent_stack_celery_beat
    volumes:
      - ./backend/app:/app/app:ro
    command: celery -A app.worker.celery_app beat --loglevel=debug
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=true
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - backend
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/python -c \"from pathlib import Path; import sys; sys.exit(0 if any('celery' in p.read_text(errors='ignore') and 'beat' in p.read_text(errors='ignore') for p in Path('/proc').glob('[0-9]*/cmdline')) else 1)\""]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  flower:
    image: ibom_ai_agent_stack_backend:dev
    pull_policy: never
    container_name: ibom_ai_agent_stack_flower
    command: celery -A app.worker.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=true
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - backend
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5555/', timeout=2).read(1)\""]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  media_data:
  redis_data:
